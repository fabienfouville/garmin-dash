<title>Athlete OS</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--ink:#e9ecf1;--muted:#8a93a3;--line:#2a303b;--accent:#39ff88;--bad:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px}
h1{margin:0;font-size:18px}
p{margin:0;color:var(--muted);font-size:13px}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
form[hidden]{display:none}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#06210f;cursor:pointer}
#err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>

</form>
