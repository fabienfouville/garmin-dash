<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Run &amp; Ride Explorer</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--ink:#e9ecf1;--muted:#8a93a3;--line:#2a303b;--accent:#39ff88;--bad:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px}
h1{margin:0;font-size:18px}
p{margin:0;color:var(--muted);font-size:13px}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
form[hidden]{display:none}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#06210f;cursor:pointer}
#err{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>

</form>

fCHuN2/VeoQBc3t1L9z+yhHJQJrYYvfZO/3rtgWRfUKuT5g==", KEY_NAME = "gdash.key";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
  const store = {
    get: () => { try { return localStorage.getItem(KEY_NAME); } catch (e) { return null; } },
    set: v => { try { localStorage.setItem(KEY_NAME, v); } catch (e) {} },
    del: () => { try { localStorage.removeItem(KEY_NAME); } catch (e) {} },
  };
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const blob = b64(PAYLOAD);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, key, blob.slice(12));
    return new TextDecoder().decode(plain);
  }
  // Swap in the decrypted page, then recreate its scripts so they run (parsed scripts are inert).
  function show(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const root = document.importNode(doc.documentElement, true);
    const scripts = [...root.querySelectorAll("script")];
    scripts.forEach(s => s.remove());
    document.replaceChild(root, document.documentElement);
    for (const old of scripts) {
      const s = document.createElement("script");
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      document.body.appendChild(s);
    }
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, 256);
  }
  const form = document.getElementById("f");
  const ask = () => { form.hidden = false; document.getElementById("pw").focus(); };
  form.onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "Unlocking…";
    let html;
    try {
      const raw = await derive(document.getElementById("pw").value);
      html = await decrypt(new Uint8Array(raw));
      store.set(hex(raw));
    } catch (x) { err.textContent = "Wrong password. Try again."; return; }
    show(html);
  };
  const saved = store.get();
  if (saved) decrypt(unhex(saved)).then(show, () => { store.del(); ask(); }); else ask();
})();
